name: 自动更新气象情报数据

on:
  schedule:
    # 每天北京时间早上 9:00 运行（UTC 时间 1:00）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 feedparser

    - name: 运行爬虫
      run: |
        cd crawlers
        python run_crawler.py <<EOF
        1
        EOF

    - name: 提交更新
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data.js
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自动更新数据 $(date '+%Y-%m-%d %H:%M')" && git push)
